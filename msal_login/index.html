<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="https://alcdn.msauth.net/browser/2.37.1/js/msal-browser.min.js"></script>
<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; }
  #btn {
    width: 100%; height: 44px; background: #D71920; color: #fff;
    border: 0; border-radius: 8px; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  #btn:disabled { opacity: .6; cursor: wait; }
  #msg { font-size: 12px; color: #6B7280; text-align: center; margin-top: 6px; min-height: 16px; }
</style>
</head>
<body>
<button id="btn" disabled>INICIAR SESIÓN CON MICROSOFT</button>
<div id="msg"></div>

<script>
const LOGIN_REQUEST = { scopes: ["User.Read"], prompt: "select_account" };
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");

function enviar(type, data) {
  window.parent.postMessage(
    Object.assign({ isStreamlitMessage: true, type: type }, data), "*"
  );
}
function setValor(v) { enviar("streamlit:setComponentValue", { value: v, dataType: "json" }); }
function setAltura() { enviar("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 }); }

let app = null;
let iniciado = false;

async function iniciar(args) {
  if (iniciado) return;

  // Si el componente está dentro de la ventana emergente de login, no hacer nada
  try {
    if (window.top !== window && window.top.opener) return;
  } catch (e) {}

  iniciado = true;

  app = new msal.PublicClientApplication({
    auth: {
      clientId: args.client_id,
      authority: "https://login.microsoftonline.com/" + args.tenant_id,
      redirectUri: args.redirect_uri
    },
    cache: { cacheLocation: "sessionStorage" }
  });

  try { await app.initialize(); } catch (e) { msg.textContent = "No se pudo iniciar Microsoft. Revisa la configuración con TI."; return; }
  btn.disabled = false;
  btn.onclick = login;
  setAltura();

  // Reingreso automático si ya hay una cuenta en caché
  if (args.silent) {
    const cuentas = app.getAllAccounts();
    if (cuentas.length > 0) {
      try {
        const r = await app.acquireTokenSilent({
          scopes: LOGIN_REQUEST.scopes, account: cuentas[0]
        });
        setValor({ token: r.accessToken });
      } catch (e) { /* si falla, el usuario usa el botón */ }
    }
  }
}

async function login() {
  btn.disabled = true;
  msg.textContent = "Esperando a Microsoft...";
  try {
    const r = await app.loginPopup(LOGIN_REQUEST);
    setValor({ token: r.accessToken });
  } catch (e) {
    msg.textContent = "No se pudo iniciar sesión. Revisa que el navegador permita ventanas emergentes.";
    setValor({ error: e.errorCode || String(e) });
  }
  btn.disabled = false;
  setAltura();
}

window.addEventListener("message", function (ev) {
  if (ev.data && ev.data.type === "streamlit:render") iniciar(ev.data.args);
});
enviar("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
